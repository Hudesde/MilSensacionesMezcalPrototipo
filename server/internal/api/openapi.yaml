openapi: 3.0.3
info:
  title: Mil Sensaciones API
  version: 0.2.0
  description: |
    API de la tienda de Mezcal Mil Sensaciones.

    - Los montos van en **centavos de MXN**: `85000` = $850.00.
    - El precio y el total los calcula siempre el servidor. Al crear un pedido solo se mandan `id` y `qty`.
servers:
  - url: /
tags:
  - name: Sistema
  - name: Catálogo
  - name: Pedidos

paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Estado del servidor y de la base de datos
      responses:
        "200":
          description: Todo en orden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/products:
    get:
      tags: [Catálogo]
      summary: Lista los productos activos
      responses:
        "200":
          description: Catálogo ordenado por precio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /api/products/{id}:
    get:
      tags: [Catálogo]
      summary: Obtiene un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [espadin, ensamble, silvestre, curados]
      responses:
        "200":
          description: El producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders:
    post:
      tags: [Pedidos]
      summary: Crea un pedido
      description: Valida los datos, calcula el total, descuenta el inventario y asigna un folio `MS-AAAA-NNNN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: JSON mal formado o con campos desconocidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No hay inventario suficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/orders/{folio}:
    get:
      tags: [Pedidos]
      summary: Consulta un pedido por folio
      parameters:
        - name: folio
          in: path
          required: true
          schema:
            type: string
            example: MS-2026-0001
      responses:
        "200":
          description: El pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    NotFound:
      description: No existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        database: { type: string, example: ok }
        storage: { type: string, enum: [postgres, memory] }
        time: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id: { type: string, example: espadin }
        name: { type: string, example: Mezcal Espadín Joven 750ml }
        priceCents: { type: integer, format: int64, example: 85000 }
        stock: { type: integer, example: 120 }
        img: { type: string, example: assets/img/botellasPrimerPlano/espadin/EspadinPP02.jpeg }
        abv: { type: string, example: 45% Alc. Vol. }
        description: { type: string }

    Customer:
      type: object
      required: [name, phone, email, address]
      properties:
        name: { type: string, example: Ana López }
        phone: { type: string, example: "951 123 4567", description: Al menos 10 dígitos }
        email: { type: string, format: email, example: ana@example.com }
        address: { type: string, example: "Calle Reforma 10, Centro, Oaxaca, 68000" }

    OrderRequest:
      type: object
      required: [customer, items]
      additionalProperties: false
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, qty]
            additionalProperties: false
            properties:
              id: { type: string, example: espadin }
              qty: { type: integer, minimum: 1, maximum: 24, example: 2 }

    OrderItem:
      type: object
      properties:
        productId: { type: string, example: espadin }
        name: { type: string }
        qty: { type: integer, example: 2 }
        unitPriceCents: { type: integer, format: int64, example: 85000 }
        subtotalCents: { type: integer, format: int64, example: 170000 }

    Order:
      type: object
      properties:
        folio: { type: string, example: MS-2026-0001 }
        status:
          type: string
          enum: [orden_recibida, pago_pendiente, pago_confirmado, en_empaque, en_transito, entregado, cancelado]
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalCents: { type: integer, format: int64, example: 170000 }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }

    ValidationError:
      type: object
      properties:
        error: { type: string, example: datos inválidos }
        fields:
          type: object
          additionalProperties: { type: string }
          example: { email: correo inválido, phone: debe tener al menos 10 dígitos }
